<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MilkChoco Agent Manager</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px;
  }
  h1 { color: #f85149; margin-bottom: 5px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 24px; }
  .drop {
    border: 2px dashed #30363d; border-radius: 12px; padding: 40px;
    text-align: center; transition: .2s; cursor: pointer;
    background: #161b22; margin-bottom: 24px;
  }
  .drop.over { border-color: #f85149; background: #1f1416; }
  .drop p { margin: 8px 0; color: #8b949e; }
  .drop .icon { font-size: 48px; }
  .list { background: #161b22; border-radius: 12px; overflow: hidden; }
  .item {
    padding: 14px 16px; border-bottom: 1px solid #30363d;
    display: flex; align-items: center; gap: 12px;
  }
  .item:last-child { border-bottom: none; }
  .item.active { background: #1a2e1e; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; color: #e6edf3; word-break: break-all; }
  .item .meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .badge {
    background: #238636; color: white; font-size: 11px;
    padding: 2px 8px; border-radius: 10px; margin-left: 6px;
  }
  button {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #30363d; }
  button.danger { color: #f85149; }
  button.primary { background: #238636; border-color: #238636; color: white; }
  button.primary:hover { background: #2ea043; }
  .empty { padding: 30px; text-align: center; color: #8b949e; }
  .status { font-size: 13px; padding: 8px 12px; margin-bottom: 12px; border-radius: 6px; }
  .status.ok { background: #1a2e1e; color: #3fb950; }
  .status.err { background: #2d1418; color: #f85149; }
  .url-box {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 12px; margin-bottom: 24px; font-family: monospace; font-size: 12px;
    word-break: break-all;
  }
  .url-box .label { color: #8b949e; margin-right: 8px; }
  .url-box a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>

<h1>MilkChoco Agent Manager</h1>
<div class="sub">agent.js をドラッグ&ドロップでアップロード → Frida Gadget が自動取得</div>

<div class="url-box">
  <span class="label">Frida URL:</span>
  <a href="/agent.js" target="_blank"><span id="gadget-url"></span></a>
</div>

<div class="drop" id="drop">
  <div class="icon">📁</div>
  <p><strong>agent.js</strong> をここにドロップ</p>
  <p>またはクリックして選択</p>
  <input type="file" id="file" accept=".js" style="display:none">
</div>

<div id="status"></div>

<div class="list" id="list">
  <div class="empty">読み込み中...</div>
</div>

<script>
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const list = document.getElementById("list");
const status = document.getElementById("status");
const gadgetUrl = document.getElementById("gadget-url");

gadgetUrl.textContent = location.origin + "/agent.js";

// ドラッグ&ドロップ
drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", async e => {
  e.preventDefault();
  drop.classList.remove("over");
  const f = e.dataTransfer.files[0];
  if (f) await upload(f);
});
fileInput.addEventListener("change", async () => {
  const f = fileInput.files[0];
  if (f) await upload(f);
  fileInput.value = "";
});

async function upload(file) {
  const content = await file.text();
  if (!content.includes("joinMatch") && !content.includes("MilkChoco") && !content.includes("Interceptor")) {
    if (!confirm("これは agent.js に見えません。続行しますか？")) return;
  }
  showStatus("アップロード中...", "");
  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: file.name, content })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    showStatus("アップロード成功 → 自動でアクティブ化", "ok");
    await refresh();
  } catch(e) {
    showStatus("エラー: " + e.message, "err");
  }
}

async function refresh() {
  try {
    const res = await fetch("/api/list");
    const data = await res.json();
    render(data.scripts);
  } catch(e) {
    list.innerHTML = '<div class="empty">読み込み失敗</div>';
  }
}

function render(scripts) {
  if (!scripts.length) {
    list.innerHTML = '<div class="empty">まだスクリプトがありません</div>';
    return;
  }
  list.innerHTML = scripts.map(s => {
    const dt = new Date(s.created_at).toLocaleString("ja-JP");
    const size = s.size ? (s.size / 1024).toFixed(1) + " KB" : "";
    return `
      <div class="item ${s.is_active ? "active" : ""}">
        <div class="info">
          <div class="name">${escape(s.name)}${s.is_active ? '<span class="badge">ACTIVE</span>' : ""}</div>
          <div class="meta">#${s.id} • ${dt} • ${size}</div>
        </div>
        ${!s.is_active ? `<button class="primary" onclick="activate(${s.id})">起動</button>` : ""}
        <button onclick="preview(${s.id})">表示</button>
        <button class="danger" onclick="remove(${s.id})">削除</button>
      </div>
    `;
  }).join("");
}

async function activate(id) {
  await fetch("/api/activate/" + id, { method: "POST" });
  showStatus("アクティブを切り替えました", "ok");
  await refresh();
}

async function remove(id) {
  if (!confirm("#" + id + " を削除しますか？")) return;
  await fetch("/api/delete/" + id, { method: "DELETE" });
  await refresh();
}

async function preview(id) {
  const res = await fetch("/api/script/" + id);
  const data = await res.json();
  const w = window.open("", "_blank");
  w.document.write('<pre style="white-space:pre-wrap;font-family:monospace;padding:20px;background:#0d1117;color:#c9d1d9;">' +
    escape(data.content) + '</pre>');
  w.document.title = data.name;
}

function showStatus(msg, cls) {
  status.textContent = msg;
  status.className = "status " + cls;
  if (cls === "ok") setTimeout(() => { status.textContent = ""; }, 3000);
}

function escape(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

refresh();
</script>
</body>
</html>
